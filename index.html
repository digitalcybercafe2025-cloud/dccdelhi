
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Cyber Cafe | Official Digital Services Gateway</title>
    <meta name="theme-color" content="#003380">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="/manifest.json">
    <script>
      // Self-healing: aggressively update Service Worker and purge old stale caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.update();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            if (name !== 'dcc-pwa-cache-v3') {
              caches.delete(name);
            }
          }
        });
      }
    </script>
    <style>
      :root {
        --brand-primary: #003380;
        --brand-gradient: linear-gradient(135deg, #003380 0%, #00255c 100%);
      }
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #ffffff;
        color: #0F172A;
        overflow-x: hidden;
      }
      .glass-nav {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }
      .dark .glass-nav {
        background: rgba(15, 23, 42, 0.8);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.1.4/swiper-bundle.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/index.css">
</head>
<body class="selection:bg-blue-100 selection:text-blue-900 transition-colors duration-500">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #003380; border-radius: 50%; animation: dcc-spin 0.75s linear infinite;"></div>
        <div style="margin-top: 14px; font-weight: 700; color: #003380; font-size: 15px; letter-spacing: 0.3px;">Digital Cyber Cafe</div>
        <div style="margin-top: 4px; font-size: 13px; color: #64748b;">Loading portal...</div>
        <style>@keyframes dcc-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
